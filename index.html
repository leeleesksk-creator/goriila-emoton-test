<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        #video-container {
            position: relative;
            width: 80%;
            max-width: 800px;
        }

        #video-container.hidden {
            display: none;
        }

        #end-screen {
            display: none;
            text-align: center;
        }

        #end-screen.show {
            display: block;
        }

        #question {
            font-size: 28px;
            margin-bottom: 20px;
        }

        #reveal {
            font-size: 24px;
            color: #ff6b6b;
            margin-top: 30px;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Count white team passes</h1>
    
    <div id="video-container">
        <iframe 
            id="youtube-video"
            src="https://www.youtube.com/embed/vJG698U2Mvo?autoplay=1&enablejsapi=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div id="end-screen">
        <div id="question">How many passes?</div>
        <div id="reveal"></div>
    </div>

    <!-- Progressive difficulty modal system -->
    <script src="script.js"></script>
    
    <script>
        // Video test duration and end screen logic
        const TEST_DURATION = 80000; // 80 seconds
        const testStartTime = Date.now();

        function endTest() {
            const videoContainer = document.getElementById('video-container');
            const endScreen = document.getElementById('end-screen');
            const reveal = document.getElementById('reveal');
            
            // Hide video
            videoContainer.classList.add('hidden');
            
            // Show end screen
            endScreen.classList.add('show');
            
            // Reveal the gorilla question after a short delay
            setTimeout(() => {
                reveal.textContent = 'Did you see the gorilla?';
            }, 2000);
        }

        // End test after 80 seconds
        window.addEventListener('load', function() {
            setTimeout(() => {
                endTest();
            }, TEST_DURATION);
        });
    </script>
</body>
</html>
